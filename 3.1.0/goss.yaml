      - "Successfully added `conn_id`=redis_cache"
  airflow-add-slack-default:
    exec: |
      airflow connections add slack_default --conn-type slack --conn-password xoxb-dummy --conn-extra '{"webhook_token":"https://hooks.slack.com/services/T000/B000/XXX"}'
