file:
  /bin/airflow:
    exists: true
    path: /bin/airflow
    owner: root
    group: root
    filetype: file
    mode: "0755"
  /lib/python3.12/site-packages/airflow:
    exists: true
    path: /lib/python3.12/site-packages/airflow
    filetype: directory
    owner: root
    group: root
    mode: "0755"
  /var/lib/airflow:
    exists: true
    path: /var/lib/airflow
    filetype: directory
    owner: root
    group: root
    mode: "0755"
  /var/lib/airflow/airflow.cfg:
    exists: true
    path: /var/lib/airflow/airflow.cfg
    owner: root
    group: root
    filetype: file
    mode: "0600"
  /var/lib/airflow/logs:
    exists: true
    path: /var/lib/airflow/logs
    filetype: directory
    owner: root
    group: root
    mode: "0755"
  /licenses/LICENSE-airflow:
    exists: true
    path: /licenses/LICENSE-airflow
    mode: "0644"
    owner: root
    group: root
    filetype: file
  /licenses/LICENSE-airflow-rock:
    exists: true
    path: /licenses/LICENSE-airflow-rock
    mode: "0644"
    owner: root
    group: root
    filetype: file
  /usr/share/rocks/dpkg.query:
    exists: true
    mode: "0644"
    filetype: file
    owner: root
    group: root

http:
  "http://127.0.0.1:8080/api/v2/monitor/health":
    status: 200
    timeout: 5000
    allow-insecure: true
    body:
        - '/"metadatabase"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
        - '/"scheduler"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
        - '/"triggerer"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
        - '/"dag_processor"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
