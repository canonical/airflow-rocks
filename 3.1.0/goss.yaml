command:
  airflow-version:
    exec: "airflow version"
    exit-status: 0
    timeout: 90000
    stdout:
        - "/^3\\.1\\./"
  pebble-services:
    exec: "pebble services"
    exit-status: 0
  airflow-standalone-running:
    exec: "sh -lc \"ps -eo pid,cmd | grep -F 'airflow standalone' | grep -v grep | wc -l\""
    exit-status: 0
    stdout:
      - '1'
  default-executor-is-local:
    exec: "/bin/airflow config get-value core executor"
    exit-status: 0
    timeout: 90000
    stdout:
      - "/^(LocalExecutor|SequentialExecutor)$/"
  k8s-executor-env-override:
    exec: AIRFLOW__CORE__EXECUTOR=KubernetesExecutor /bin/airflow config get-value core executor
    exit-status: 0
    timeout: 90000
    stdout:
      - "/^KubernetesExecutor$/"
  celery-executor-env-override:
    exec: AIRFLOW__CORE__EXECUTOR=CeleryExecutor /bin/airflow config get-value core executor
    exit-status: 0
    timeout: 90000
    stdout:
      - "/^CeleryExecutor$/"
  sa-driver-postgres:
    exec: python3 -c "from sqlalchemy import create_engine; create_engine('postgresql+psycopg2://user:pass@localhost/db'); import sys; sys.stdout.write('ok')"
    exit-status: 0
    stdout: "ok"
  sa-driver-mysql:
    exec: python3 -c "from sqlalchemy import create_engine; create_engine('mysql+mysqldb://user:pass@localhost/db'); import sys; sys.stdout.write('ok')"
    exit-status: 0
    stdout: "ok"
  sa-driver-sqlite:
    exec: python3 -c "from sqlalchemy import create_engine; create_engine('sqlite://'); import sys; sys.stdout.write('ok')"
    exit-status: 0
    stdout: "ok"
  sa-driver-odbc:
    exec: python3 -c "from sqlalchemy import create_engine; create_engine('mssql+pyodbc://user:pass@localhost/db?driver=ODBC+Driver+18+for+SQL+Server'); import sys; sys.stdout.write('ok')"
    exit-status: 0
    stdout: "ok"
  sa-driver-mysql-pymysql:
    exec: python3 -c "from sqlalchemy import create_engine; create_engine('mysql+pymysql://user:pass@localhost/db?driver=ODBC+Driver+18+for+SQL+Server'); import sys; sys.stdout.write('ok')"
    exit-status: 0
    stdout: "ok"
  providers-import-check:
    exec: |
      export PROVIDERS="$(
      airflow providers list --output plain \
        | awk 'NR>1 {print $1}' \
        | sed 's/-/_/g; s/apache_airflow_providers_//g; s/^airflow\.providers\.//g' \
        | grep -Ev '(^providers|^$|^_$)'
      )"
      python3 - <<'PY'
      import importlib, os, sys
      for name in os.environ['PROVIDERS'].split():
          mod = importlib.import_module(f"airflow.providers.{name.replace('_', '.')}")
          if not [a for a in dir(mod) if not a.startswith("__")]:
              sys.exit(1)
      PY
    exit-status: 0
    timeout: 90000
  airflow-add-elasticsearch-default:
    exec: |
      airflow connections add elasticsearch_default --conn-type elasticsearch --conn-host localhost --conn-port 9200 --conn-schema http
    exit-status: 0
    timeout: 90000
    stdout:
      - "Successfully added `conn_id`=elasticsearch_default"
  airflow-add-imap-default:
    exec: |
      airflow connections add imap_default --conn-type imap --conn-host localhost --conn-port 993 --conn-login test --conn-password test
    exit-status: 0
    timeout: 90000
    stdout:
      - "Successfully added `conn_id`=imap_default"
  airflow-add-hashicorp-default:
    exec: |
      airflow connections add hashicorp_default --conn-type hashicorp --conn-host http://localhost:8200 --conn-extra '{"auth_type":"token","token":"test"}'
    exit-status: 0
    timeout: 90000
    stdout:
      - "Successfully added `conn_id`=hashicorp_default"
  airflow-add-aws-default:
    title: "Airflow adds aws_default connection"
    exec: |
      airflow connections add aws_default --conn-type aws --conn-login test --conn-password test --conn-extra '{"region_name":"us-east-1","endpoint_url":"http://localhost:4566"}'
    exit-status: 0
    timeout: 90000
    stdout:
      - "Successfully added `conn_id`=aws_default"
  airflow-add-postgres-default:
    exec: |
      airflow connections add postgres_default --conn-type postgres --conn-host localhost --conn-port 5432 --conn-login test --conn-password test --conn-schema testdb
    exit-status: 0
    timeout: 90000
    stdout:
      - "Successfully added `conn_id`=postgres_default"
  airflow-add-mysql-default:
    exec: |
      airflow connections add mysql_default --conn-type mysql --conn-host localhost --conn-port 3306 --conn-login test --conn-password test --conn-schema testdb
