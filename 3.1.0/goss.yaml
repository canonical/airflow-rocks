command:
  airflow-version:
    exec: "airflow version"
    exit-status: 0
    timeout: 90000
    stdout:
        - "/^3\\.1\\./"
  pebble-services:
    exec: "pebble services"
    exit-status: 0
  airflow-standalone-running:
    exec: "sh -lc \"ps -eo pid,cmd | grep -F 'airflow standalone' | grep -v grep | wc -l\""
    exit-status: 0
    stdout:
      - '1'
  default-executor-is-local:
    exec: "/bin/airflow config get-value core executor"
    exit-status: 0
    timeout: 90000
    stdout:
      - "/^(LocalExecutor|SequentialExecutor)$/"
  k8s-executor-env-override:
    exec: AIRFLOW__CORE__EXECUTOR=KubernetesExecutor /bin/airflow config get-value core executor
    exit-status: 0
    timeout: 90000
    stdout:
      - "/^KubernetesExecutor$/"
  celery-executor-env-override:
    exec: AIRFLOW__CORE__EXECUTOR=CeleryExecutor /bin/airflow config get-value core executor
    exit-status: 0
    timeout: 90000
    stdout:
      - "/^CeleryExecutor$/"
  sa-driver-postgres:
    exec: python3 -c "from sqlalchemy import create_engine; create_engine('postgresql+psycopg2://user:pass@localhost/db'); import sys; sys.stdout.write('ok')"
    exit-status: 0
    stdout: "ok"
  sa-driver-mysql:
    exec: python3 -c "from sqlalchemy import create_engine; create_engine('mysql+mysqldb://user:pass@localhost/db'); import sys; sys.stdout.write('ok')"
    exit-status: 0
    stdout: "ok"
  sa-driver-sqlite:
    exec: python3 -c "from sqlalchemy import create_engine; create_engine('sqlite://'); import sys; sys.stdout.write('ok')"
    exit-status: 0
    stdout: "ok"
  sa-driver-odbc:
    exec: python3 -c "from sqlalchemy import create_engine; create_engine('mssql+pyodbc://user:pass@localhost/db?driver=ODBC+Driver+18+for+SQL+Server'); import sys; sys.stdout.write('ok')"
    exit-status: 0
    stdout: "ok"
  sa-driver-mysql-pymysql:
    exec: python3 -c "from sqlalchemy import create_engine; create_engine('mysql+pymysql://user:pass@localhost/db?driver=ODBC+Driver+18+for+SQL+Server'); import sys; sys.stdout.write('ok')"
    exit-status: 0
    stdout: "ok"
  providers-import-check:
    exec: |
      export PROVIDERS="$(
      airflow providers list --output plain \
        | awk 'NR>1 {print $1}' \
        | sed 's/-/_/g; s/apache_airflow_providers_//g; s/^airflow\.providers\.//g' \
        | grep -Ev '(^providers|^$|^_$)'
      )"
      python3 - <<'PY'
      import importlib, os, sys
      for name in os.environ['PROVIDERS'].split():
          mod = importlib.import_module(f"airflow.providers.{name.replace('_', '.')}")
          if not [a for a in dir(mod) if not a.startswith("__")]:
              sys.exit(1)
      PY
    exit-status: 0
    timeout: 90000
file:
  /bin/airflow:
    exists: true
    path: /bin/airflow
    owner: root
    group: root
    filetype: file
    mode: "0755"
  /lib/python3.12/site-packages/airflow:
    exists: true
    path: /lib/python3.12/site-packages/airflow
    filetype: directory
    owner: root
    group: root
    mode: "0755"
  /var/lib/airflow:
    exists: true
    path: /var/lib/airflow
    filetype: directory
    owner: root
    group: root
    mode: "0755"
  /var/lib/airflow/airflow.cfg:
    exists: true
    path: /var/lib/airflow/airflow.cfg
    owner: root
    group: root
    filetype: file
    mode: "0600"
  /var/lib/airflow/logs:
    exists: true
    path: /var/lib/airflow/logs
    filetype: directory
    owner: root
    group: root
    mode: "0755"
  /licenses/LICENSE-airflow:
    exists: true
    path: /licenses/LICENSE-airflow
    mode: "0644"
    owner: root
    group: root
    filetype: file
  /licenses/LICENSE-airflow-rock:
    exists: true
    path: /licenses/LICENSE-airflow-rock
    mode: "0644"
    owner: root
    group: root
    filetype: file
  /usr/share/rocks/dpkg.query:
    exists: true
    mode: "0644"
    filetype: file
    owner: root
    group: root

http:
  "http://127.0.0.1:8080/api/v2/monitor/health":
    status: 200
    timeout: 5000
    allow-insecure: true
    body:
        - '/"metadatabase"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
        - '/"scheduler"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
        - '/"triggerer"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
        - '/"dag_processor"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
