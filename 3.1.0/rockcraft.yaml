name: airflow-rock
version: "3.1.0"
summary: Apache Airflow Rock
description: |
  Builds Apache Airflow 3.1.0 from source on Ubuntu 24.04 (Python 3.12).

base: ubuntu@24.04
build-base: ubuntu@24.04
platforms:
  amd64:
environment:
  AIRFLOW_HOME: /var/lib/airflow

services:
  airflow:
    override: replace
    startup: enabled
    command: /usr/bin/airflow standalone

checks:
  airflow-running:
    override: replace
    exec:
      command: pgrep airflow

parts:
  airflow:
    plugin: python
    source: https://github.com/apache/airflow
    source-type: git
    source-tag: 3.1.0
    build-packages:
      - build-essential
      - pkg-config
      - libmariadb-dev
      - unixodbc-dev
    stage-packages:
      - python3-venv
      - libmariadb3
      - unixodbc
    python-constraints: 
      - https://raw.githubusercontent.com/apache/airflow/constraints-3.1.0/constraints-3.12.txt
    python-packages:
      - apache-airflow-providers-amazon[apache.hive,mongo,saleforce,exasol,common.messaging]
      - apache-airflow-providers-celery
      - apache-airflow-providers-cncf-kubernetes
      - apache-airflow-providers-common-compat
      - apache-airflow-providers-common-io
      - apache-airflow-providers-common-sql
      - apache-airflow-providers-docker
      - apache-airflow-providers-elasticsearch
      - apache-airflow-providers-fab
      - apache-airflow-providers-ftp
      - apache-airflow-providers-google[apache.cassandra,apache.beam,facebook,microsoft.mssql,presto,trino,oracle]
      - apache-airflow-providers-grpc
      - apache-airflow-providers-hashicorp
      - apache-airflow-providers-http
      - apache-airflow-providers-imap
      - apache-airflow-providers-microsoft-azure
      - apache-airflow-providers-mysql[vertica]
      - apache-airflow-providers-odbc
      - apache-airflow-providers-openlineage
      - apache-airflow-providers-postgres
      - apache-airflow-providers-redis
      - apache-airflow-providers-sendgrid
      - apache-airflow-providers-snowflake
      - apache-airflow-providers-sqlite
      - apache-airflow-providers-ssh
      - apache-airflow-providers-standard
      - apache-airflow-providers-slack
      - apache-airflow-providers-smtp
      - apache-airflow-providers-sftp
  airflow-license:
    plugin: dump
    source: https://github.com/apache/airflow
    source-type: git
    source-tag: 3.1.0 
    source-depth: 1
    organize:
      LICENSE: licenses/LICENSE-airflow 
    stage:
      - licenses/LICENSE-airflow
  airflow-rock-license:
    plugin: dump
    source: https://github.com/canonical/airflow-rocks
    source-type: git
    source-tag: main
    source-depth: 1
    organize:
      LICENSE: licenses/LICENSE-airflow-rock
    stage:
      - licenses/LICENSE-airflow-rock
  deb-security-manifest:
    plugin: nil
    after: 
      - airflow
    override-prime: |
      set -x
      mkdir -p $CRAFT_PRIME/usr/share/rocks/
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && dpkg-query --admindir=$CRAFT_PRIME/var/lib/dpkg/ -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) > $CRAFT_PRIME/usr/share/rocks/dpkg.query

