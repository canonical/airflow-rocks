name: airflow-rock
version: "3.1.0"
summary: Apache Airflow Rock
description: |
  Builds Apache Airflow 3.1.0 from source on Ubuntu 24.04 (Python 3.12).

base: ubuntu@24.04
build-base: ubuntu@24.04
platforms:
  amd64:
environment:
  AIRFLOW_HOME: /var/lib/airflow

services:
  airflow:
    override: replace
    startup: enabled
    command: /usr/bin/airflow standalone

checks:
  airflow-running:
    override: replace
    exec:
      command: pgrep airflow

parts:
  airflow:
    plugin: python
    source: https://github.com/apache/airflow
    source-type: git
    source-tag: 3.1.0
    stage-packages:
      - python3-venv
  airflow-license:
    plugin: dump
    source: https://github.com/apache/airflow
    source-type: git
    source-tag: 3.1.0 
    source-depth: 1
    organize:
      LICENSE: licenses/LICENSE-airflow 
    stage:
      - licenses/LICENSE-airflow
  airflow-rock-license:
    plugin: dump
    source: https://github.com/canonical/airflow-rocks
    source-type: git
    source-tag: main
    source-depth: 1
    organize:
      LICENSE: licenses/LICENSE-airflow-rock
    stage:
      - licenses/LICENSE-airflow-rock
  deb-security-manifest:
    plugin: nil
    after: 
      - airflow
    override-prime: |
      set -x
      mkdir -p $CRAFT_PRIME/usr/share/rocks/
      (echo "# os-release" && cat /etc/os-release && echo "# dpkg-query" && dpkg-query --admindir=$CRAFT_PRIME/var/lib/dpkg/ -f '${db:Status-Abbrev},${binary:Package},${Version},${source:Package},${Source:Version}\n' -W) > $CRAFT_PRIME/usr/share/rocks/dpkg.query
