command:
  airflow-version:
    exec: "airflow version"
    exit-status: 0
    stdout:
        - "/^3\\.1\\./"
  pebble-services:
    exec: "pebble services"
    exit-status: 0
  airflow-standalone-running:
    exec: "sh -lc \"ps -eo pid,cmd | grep -F 'airflow standalone' | grep -v grep | wc -l\""
    exit-status: 0
    stdout:
      - '1'
  airflow-standalone-user:
    exec: "sh -lc \"ps -o user= $(pgrep -f 'airflow standalone') | head -n 1\""
    exit-status: 0
    stdout:
      - 'ubuntu'
  default-executor-is-local:
    exec: "/bin/airflow config get-value core executor"
    exit-status: 0
    stdout:
      - "/^(LocalExecutor|SequentialExecutor)$/"
  k8s-executor-env-override:
    exec: AIRFLOW__CORE__EXECUTOR=KubernetesExecutor /bin/airflow config get-value core executor
    exit-status: 0
    stdout:
      - "/^KubernetesExecutor$/"
  celery-executor-env-override:
    exec: AIRFLOW__CORE__EXECUTOR=CeleryExecutor /bin/airflow config get-value core executor
    exit-status: 0
    stdout:
      - "/^CeleryExecutor$/"
  providers-import-check:
    timeout: 60000
    exec: |
      export PROVIDERS="$(
      airflow providers list --output plain \
        | awk '/^apache-/{print $1}' \
        | sed 's/-/_/g; s/apache_airflow_providers_//g; s/^airflow\.providers\.//g' \
        | grep -Ev '(^providers|^$|^_$)'
      )"
      python3 - <<'PY'
      import importlib, os, sys
      for name in os.environ['PROVIDERS'].split():
          mod = importlib.import_module(f"airflow.providers.{name.replace('_', '.')}")
          if not [a for a in dir(mod) if not a.startswith("__")]:
              print(mod)
              sys.exit(1)
      PY
    exit-status: 0
  airflow-providers-list:
    exec: airflow providers list --output plain   | grep -v 'package_name'   | awk '/^apache-/{name=$1; version=$NF; print name" | "version}'
    exit-status: 0
    stdout:
      - "apache-airflow-providers-amazon | 9.22.0"
      - "apache-airflow-providers-apache-cassandra | 3.9.2"
      - "apache-airflow-providers-apache-hive | 9.3.0"
      - "apache-airflow-providers-celery | 3.17.0"
      - "apache-airflow-providers-cncf-kubernetes | 10.13.0"
      - "apache-airflow-providers-common-compat | 1.14.0"
      - "apache-airflow-providers-common-io | 1.7.1"
      - "apache-airflow-providers-common-messaging | 2.0.2"
      - "apache-airflow-providers-common-sql | 1.32.0"
      - "apache-airflow-providers-docker | 4.5.2"
      - "apache-airflow-providers-elasticsearch | 6.5.0"
      - "apache-airflow-providers-exasol | 4.10.0"
      - "apache-airflow-providers-fab | 3.4.0"
      - "apache-airflow-providers-facebook | 3.9.2"
      - "apache-airflow-providers-ftp | 3.14.1"
      - "apache-airflow-providers-google | 20.0.0"
      - "apache-airflow-providers-grpc | 3.9.2"
      - "apache-airflow-providers-hashicorp | 4.5.0"
      - "apache-airflow-providers-http | 6.0.0"
      - "apache-airflow-providers-imap | 3.11.0"
      - "apache-airflow-providers-microsoft-azure | 13.0.0"
      - "apache-airflow-providers-microsoft-mssql | 4.5.0"
      - "apache-airflow-providers-mongo | 5.3.2"
      - "apache-airflow-providers-mysql | 6.5.0"
      - "apache-airflow-providers-odbc | 4.12.0"
      - "apache-airflow-providers-openlineage | 2.11.0"
      - "apache-airflow-providers-oracle | 4.5.0"
      - "apache-airflow-providers-postgres | 6.6.0"
      - "apache-airflow-providers-presto | 5.11.0"
      - "apache-airflow-providers-redis | 4.4.2"
      - "apache-airflow-providers-sendgrid | 4.2.1"
      - "apache-airflow-providers-sftp | 5.7.0"
      - "apache-airflow-providers-slack | 9.7.0"
      - "apache-airflow-providers-smtp | 2.4.2"
      - "apache-airflow-providers-snowflake | 6.10.0"
      - "apache-airflow-providers-sqlite | 4.3.0"
      - "apache-airflow-providers-ssh | 4.3.1"
      - "apache-airflow-providers-standard | 1.12.0"
      - "apache-airflow-providers-trino | 6.5.0"
      - "apache-airflow-providers-vertica | 4.3.0"
  rock-signature-valid-json:
    exec: "python3 -m json.tool /opt/airflow/rock-signature || echo 'Invalid JSON in rock-signature'"
    exit-status: 0
  rock-signature-version-match:
    exec: "python3 -c \"import json; sig=json.load(open('/opt/airflow/rock-signature')); v=sig['version']; assert v == '3.1.8', f'Version mismatch: {v}'\""
    exit-status: 0
  rock-signature-has-valid-md5:
    exec: "python3 -c \"import json; sig=json.load(open('/opt/airflow/rock-signature')); m=sig['md5']; assert len(m) == 32, f'Invalid MD5 length: {len(m)}'\""
    exit-status: 0

file:
  /bin/airflow:
    exists: true
    path: /bin/airflow
    owner: root
    group: root
    filetype: file
    mode: "0755"
  /lib/python3.12/site-packages/airflow:
    exists: true
    path: /lib/python3.12/site-packages/airflow
    filetype: directory
    owner: root
    group: root
    mode: "0755"
  /opt/airflow:
    exists: true
    path: /opt/airflow
    filetype: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  /opt/airflow/airflow.cfg:
    exists: true
    path: /opt/airflow/airflow.cfg
    owner: ubuntu
    group: ubuntu
    filetype: file
    mode: "0600"
  /opt/airflow/logs:
    exists: true
    path: /opt/airflow/logs
    filetype: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  /licenses/LICENSE-airflow:
    exists: true
    path: /licenses/LICENSE-airflow
    mode: "0644"
    owner: root
    group: root
    filetype: file
  /licenses/LICENSE-airflow-rock:
    exists: true
    path: /licenses/LICENSE-airflow-rock
    mode: "0644"
    owner: root
    group: root
    filetype: file
  /usr/share/rocks/dpkg.query:
    exists: true
    mode: "0644"
    filetype: file
    owner: root
    group: root
  /opt/airflow/rock-signature:
    exists: true
    mode: "0644"
    filetype: file
    owner: ubuntu
    group: ubuntu
    contents:
      - '"version"'
      - '"md5"'
      - '"build_timestamp"'

user:
  root:
    exists: true
    uid: 0
    gid: 0
  ubuntu:
    exists: true
    uid: 1000
    gid: 1000

http:
  "http://127.0.0.1:8080/api/v2/monitor/health":
    status: 200
    timeout: 5000
    allow-insecure: true
    body:
        - '/"metadatabase"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
        - '/"scheduler"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
        - '/"triggerer"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
        - '/"dag_processor"\s*:\s*\{\s*"status"\s*:\s*"healthy"/'
