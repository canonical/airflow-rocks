name: airflow
version: "3.1.8"
summary: Apache Airflow Rock
description: |
  Builds Apache Airflow 3.1.8 from source on Ubuntu 24.04 (Python 3.12).

base: ubuntu@24.04
platforms:
  amd64:
environment:
  AIRFLOW_HOME: /opt/airflow

services:
  airflow:
    override: replace
    startup: enabled
    command: /usr/bin/airflow standalone
    user: ubuntu
    group: ubuntu

checks:
  airflow-running:
    override: replace
    exec:
      command: pgrep airflow

parts:
  airflow:
    plugin: python
    source: https://github.com/apache/airflow
    source-type: git
    source-tag: 3.1.8
    build-packages:
      - build-essential
      - pkg-config
      - libmariadb-dev
      - unixodbc-dev
    stage-packages:
      - python3-venv
      - libmariadb3
      - unixodbc
      - git
    python-constraints:
      - https://raw.githubusercontent.com/apache/airflow/constraints-3.1.8/constraints-3.12.txt
    python-packages:
      - apache-airflow-providers-amazon[apache.hive,mongo,saleforce,exasol,common.messaging]
      - apache-airflow-providers-celery
      - apache-airflow-providers-cncf-kubernetes
      - apache-airflow-providers-common-compat
      - apache-airflow-providers-common-io
      - apache-airflow-providers-common-sql
      - apache-airflow-providers-docker
      - apache-airflow-providers-elasticsearch
      - apache-airflow-providers-fab
      - apache-airflow-providers-ftp
      - apache-airflow-providers-git
      - apache-airflow-providers-google[apache.cassandra,apache.beam,facebook,microsoft.mssql,presto,trino,oracle]
      - apache-airflow-providers-grpc
      - apache-airflow-providers-hashicorp
      - apache-airflow-providers-http
      - apache-airflow-providers-imap
      - apache-airflow-providers-microsoft-azure
      - apache-airflow-providers-mysql[vertica]
      - apache-airflow-providers-odbc
      - apache-airflow-providers-openlineage
      - apache-airflow-providers-postgres
      - apache-airflow-providers-redis
      - apache-airflow-providers-sendgrid
      - apache-airflow-providers-snowflake
      - apache-airflow-providers-sqlite
      - apache-airflow-providers-ssh
      - apache-airflow-providers-standard
      - apache-airflow-providers-slack
      - apache-airflow-providers-smtp
      - apache-airflow-providers-sftp
  airflow-license:
    plugin: dump
    source: https://github.com/apache/airflow
    source-type: git
    source-tag: 3.1.8
    source-depth: 1
    organize:
      LICENSE: licenses/LICENSE-airflow
    stage:
      - licenses/LICENSE-airflow
  airflow-rock-license:
    plugin: dump
    source: https://github.com/canonical/airflow-rocks
    source-type: git
    source-tag: main
    source-depth: 1
    organize:
      LICENSE: licenses/LICENSE-airflow-rock
    stage:
      - licenses/LICENSE-airflow-rock
  deb-security-manifest:
    plugin: make
    source: https://github.com/canonical/rocks-security-manifest
    source-type: git
    source-branch: main
    override-prime: gen_manifest
  airflow-signature:
    plugin: nil
    after:
      - airflow
    override-stage: |
      AIRFLOW_VERSION="${CRAFT_PROJECT_VERSION}"

      AIRFLOW_MD5=$(find ${CRAFT_STAGE}/lib/python3.12/site-packages \
        \( -name "airflow" -o -name "apache_airflow*" \) \
        -type d -exec find {} -type f \; 2>/dev/null \
        | sort | xargs md5sum 2>/dev/null | md5sum | cut -d' ' -f1)

      BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

      mkdir -p ${CRAFT_PART_INSTALL}/opt/airflow

      python3 -c "import json; print(json.dumps({'version': '${AIRFLOW_VERSION}', 'md5': '${AIRFLOW_MD5}', 'build_timestamp': '${BUILD_TIMESTAMP}'}, indent=2))" > ${CRAFT_PART_INSTALL}/opt/airflow/rock-signature

      chmod 0644 ${CRAFT_PART_INSTALL}/opt/airflow/rock-signature

      craftctl default
    stage:
      - opt/airflow/rock-signature
  airflow-permissions:
    plugin: nil
    after:
      - airflow-signature
    override-prime: |
      set -e
      mkdir -p ${CRAFT_PRIME}/opt/airflow/logs
      chown -R 1000:1000 ${CRAFT_PRIME}/opt/airflow

